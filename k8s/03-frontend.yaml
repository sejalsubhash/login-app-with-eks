apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier-login
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Pins frontend pods to nodes labeled workload=frontend.
      # Run: kubectl label nodes <node-name> workload=frontend
      nodeSelector:
        workload: frontend
      containers:
        - name: frontend
          image: <YOUR_ECR_REPO>/three-tier-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: three-tier-login
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
