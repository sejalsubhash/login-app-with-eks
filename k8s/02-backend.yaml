apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: three-tier-login
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Pins backend pods to nodes labeled workload=backend.
      # Run: kubectl label nodes <node-name> workload=backend
      nodeSelector:
        workload: backend
      containers:
        - name: backend
          image: 495219733157.dkr.ecr.ap-south-1.amazonaws.com/three-tier-backend
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: db-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: three-tier-login
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
