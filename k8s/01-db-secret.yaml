# Replace the placeholder values below (or create with `kubectl create secret generic`
# from the CLI instead of committing real credentials to yaml).
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: three-tier-login
type: Opaque
stringData:
  DB_HOST: "your-rds-endpoint.rds.amazonaws.com"
  DB_USER: "admin"
  DB_PASSWORD: "your-db-password"
  DB_NAME: "appdb"
  DB_PORT: "3306"
  JWT_SECRET: "change-this-secret"
